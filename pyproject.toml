[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprofix"
version = "0.1.0"
description = "Autonomous reproduce -> diagnose -> repair -> verify agent for broken ML repositories, powered by NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26", "pyyaml>=6"]

[project.scripts]
reprofix = "reprofix.cli:main"

[tool.setuptools.packages.find]
include = ["reprofix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
